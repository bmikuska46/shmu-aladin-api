services:
  api:
    build: .
    container_name: shmu-weather-api
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      WEB_URL: "http://localhost:8080"
      DATABASE_PATH: /data/shmu.db
      STATIONS_CACHE_TTL: 168h
      # Cron fetches ALADIN at publish+5m, retries every 5m until available
      SYNC_FORECASTS: "true"
      FETCH_DELAY_AFTER_PUBLISH: 5m
      FETCH_RETRY_EVERY: 5m
      PROBE_STATION_ID: "32737"
      HTTP_TIMEOUT: 30s
      RATE_LIMIT: "10"
      RATE_LIMIT_WINDOW: 1m
      FORECAST_STALE_AFTER: 8h
    volumes:
      - shmu-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: shmu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: shmu-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  shmu-data:
  prometheus-data:
  grafana-data:
