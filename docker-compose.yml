# Self-contained compose: configs are inlined so Portainer stacks work
# without a local ./deploy bind-mount (which fails when those paths are missing).

services:
  api:
    build: .
    container_name: shmu-weather-api
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      WEB_URL: "http://localhost:8080"
      DATABASE_PATH: /data/shmu.db
      STATIONS_CACHE_TTL: 168h
      SYNC_FORECASTS: "true"
      FETCH_DELAY_AFTER_PUBLISH: 5m
      FETCH_RETRY_EVERY: 5m
      PROBE_STATION_ID: "32737"
      HTTP_TIMEOUT: 30s
      RATE_LIMIT: "10"
      RATE_LIMIT_WINDOW: 1m
      FORECAST_STALE_AFTER: 8h
    volumes:
      - shmu-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: shmu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: shmu-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dashboard
        target: /var/lib/grafana/dashboards/api-hits.json
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  shmu-data:
  prometheus-data:
  grafana-data:

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: shmu-weather-api
          metrics_path: /metrics
          static_configs:
            - targets: ["api:8080"]

  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false

  grafana_dashboard_provider:
    content: |
      apiVersion: 1
      providers:
        - name: shmu-weather-api
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards

  grafana_dashboard:
    content: |
      {
        "annotations": {
          "list": []
        },
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 0,
        "id": null,
        "links": [],
        "panels": [
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              },
              "overrides": []
            },
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
            "id": 1,
            "options": {
              "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
              "tooltip": { "mode": "single", "sort": "none" }
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum(rate(http_requests_total[5m]))",
                "legendFormat": "all",
                "refId": "A"
              }
            ],
            "title": "Request rate",
            "type": "timeseries"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
            "id": 2,
            "options": {
              "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
              "tooltip": { "mode": "single", "sort": "none" }
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum by (route) (increase(http_requests_total[1h]))",
                "legendFormat": "{{route}}",
                "refId": "A"
              }
            ],
            "title": "Hits by route (last 1h)",
            "type": "timeseries"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
            "id": 3,
            "options": {
              "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
              "tooltip": { "mode": "single", "sort": "none" }
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum by (code) (increase(http_requests_total[1h]))",
                "legendFormat": "{{code}}",
                "refId": "A"
              }
            ],
            "title": "Hits by status (last 1h)",
            "type": "timeseries"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
            },
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
            "id": 4,
            "options": {
              "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
              "tooltip": { "mode": "single", "sort": "none" }
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m])))",
                "legendFormat": "{{route}} p95",
                "refId": "A"
              }
            ],
            "title": "Latency p95 by route",
            "type": "timeseries"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
            "id": 5,
            "options": {
              "displayMode": "list",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "orientation": "horizontal",
              "showUnfilled": true
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum by (route) (http_requests_total)",
                "legendFormat": "{{route}}",
                "refId": "A"
              }
            ],
            "title": "Total hits by route (since process start)",
            "type": "bargauge"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "gridPos": { "h": 10, "w": 12, "x": 0, "y": 24 },
            "id": 6,
            "options": {
              "displayMode": "list",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "orientation": "horizontal",
              "showUnfilled": true
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "topk(15, sum by (station_id) (api_station_requests_total))",
                "legendFormat": "{{station_id}}",
                "refId": "A"
              }
            ],
            "title": "Top stations (matched ID only)",
            "type": "bargauge"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "gridPos": { "h": 10, "w": 12, "x": 12, "y": 24 },
            "id": 7,
            "options": {
              "displayMode": "list",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "orientation": "horizontal",
              "showUnfilled": true
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum by (hours) (api_forecast_hours_requested_total)",
                "legendFormat": "{{hours}}",
                "refId": "A"
              }
            ],
            "title": "Forecast hours requested (full = omitted)",
            "type": "bargauge"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              },
              "overrides": []
            },
            "gridPos": { "h": 10, "w": 12, "x": 0, "y": 34 },
            "id": 8,
            "options": {
              "displayMode": "list",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "orientation": "horizontal",
              "showUnfilled": true
            },
            "targets": [
              {
                "datasource": { "type": "prometheus", "uid": "prometheus" },
                "expr": "sum by (days) (api_forecast_days_requested_total)",
                "legendFormat": "{{days}}",
                "refId": "A"
              }
            ],
            "title": "Daily forecast days requested (full = omitted)",
            "type": "bargauge"
          }
        ],
        "refresh": "30s",
        "schemaVersion": 39,
        "tags": ["shmu", "api"],
        "templating": { "list": [] },
        "time": { "from": "now-6h", "to": "now" },
        "timepicker": {},
        "timezone": "browser",
        "title": "SHMU Weather API",
        "uid": "shmu-weather-api",
        "version": 1
      }
